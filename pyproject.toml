[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-trap"
version = "0.1.0"
description = "Offline speed trap: fuse HLK-LD2451 radar readings with camera detections and tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruno Mendonça" }]
keywords = ["speed-trap", "radar", "ld2451", "hlk-ld2451", "sensor-fusion", "object-detection", "tracking", "rf-detr", "bytetrack", "computer-vision"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "pillow>=10",
    "av>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "supervision>=0.25",
    "ld2451",
    "radar-cam-recorder",
    "trackers>=2.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bfMendonca/hlk-ld2451-speed-trap"
Issues = "https://github.com/bfMendonca/hlk-ld2451-speed-trap/issues"
Changelog = "https://github.com/bfMendonca/hlk-ld2451-speed-trap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
rfdetr = ["rfdetr>=1.2"]
yolo = ["ultralytics>=8.3"]  # AGPL-3.0 terms apply

[project.scripts]
speed-trap = "speed_trap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-github-actions-annotate-failures>=0.3", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ld2451 = { git = "https://github.com/bfMendonca/ld2451.git", branch = "main" }
radar-cam-recorder = { git = "https://github.com/bfMendonca/radar-cam-recorder.git", branch = "master" }

[tool.setuptools.packages.find]
include = ["speed_trap*"]

[tool.setuptools.package-data]
speed_trap = ["default_config.yaml", "render/fonts/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # third-party: rfdetr's backbone still calls torch.jit.script
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/design"]  # historical design records, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["speed_trap", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "serial", "serial.*", "ultralytics", "ultralytics.*", "rfdetr", "rfdetr.*"]
ignore_missing_imports = true
