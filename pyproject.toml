[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-trap"
version = "0.1.0"
description = "Offline speed trap: fuse HLK-LD2451 radar data with camera video"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "pillow>=10",
    "av>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "supervision>=0.25",
    "ld2451",
    "radar-cam-recorder",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
rfdetr = ["rfdetr>=1.2"]
yolo = ["ultralytics>=8.3"]  # AGPL-3.0 terms apply

[project.scripts]
speed-trap = "speed_trap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ld2451 = { path = "../driver-hlk-ld2451", editable = true }
radar-cam-recorder = { path = "../radar-cam-recorder", editable = true }

[tool.setuptools.packages.find]
include = ["speed_trap*"]

[tool.setuptools.package-data]
speed_trap = ["default_config.yaml", "render/fonts/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["speed_trap", "tests"]
plugins = ["pydantic.mypy"]
