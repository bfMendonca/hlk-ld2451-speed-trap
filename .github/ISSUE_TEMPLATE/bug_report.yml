name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The `speed-trap` command, your config (`speed-trap check-config --config ...`) and, if you can, a `speed-trap synth` seed that shows the problem.
      render: shell
  - type: textarea
    id: info
    attributes:
      label: Environment
      description: OS, Python version, `uv pip show speed-trap ld2451 radar-cam-recorder`, detector backend and device.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: "The error line (re-run with `-vv` for the traceback) and the run's `run.json`, if relevant."
      render: text
